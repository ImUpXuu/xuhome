name: 缓存保温（清除 Cloudflare 缓存 + 持续预热首页）

on:
  schedule:
    # 每 6 小时触发一次，衔接单次 5h55m 的运行（GitHub Actions 单 job 上限 6h）
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  keep-warm:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      # ---- 预热前先清空 Cloudflare 全站缓存，确保拉到的都是最新内容 ----
      - name: 清除 Cloudflare 全站缓存
        env:
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
        run: |
          AUTH_ARGS=()
          # 优先用 API Token，其次兼容 Global API Key + Email
          if [ -n "${CLOUDFLARE_API_TOKEN:-}" ]; then
            AUTH_ARGS=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          elif [ -n "${CLOUDFLARE_API_KEY:-}" ] && [ -n "${CLOUDFLARE_EMAIL:-}" ]; then
            AUTH_ARGS=(-H "X-Auth-Email: ${CLOUDFLARE_EMAIL}" -H "X-Auth-Key: ${CLOUDFLARE_API_KEY}")
          else
            echo "::error::未配置 Cloudflare 凭据，请添加 secrets：CLOUDFLARE_API_TOKEN（或 CLOUDFLARE_API_KEY + CLOUDFLARE_EMAIL）和 CLOUDFLARE_ZONE_ID"
            exit 1
          fi

          code=$(curl -s -o purge.log -w "%{http_code}" -m 30 \
            -X POST "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/purge_cache" \
            "${AUTH_ARGS[@]}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}')

          if [ "$code" = "200" ]; then
            echo "✅ Cloudflare 全站缓存已清空，开始预热"
          else
            echo "❌ Cloudflare 缓存清除失败 HTTP=$code：$(cat purge.log)"
            echo "::error::Cloudflare 缓存清除失败，请检查 CLOUDFLARE_ZONE_ID / API 凭据是否有效"
            exit 1
          fi

      - name: 每 30 秒请求一次首页（保温 5h55m）
        run: |
          END=$((SECONDS + 21300))   # 5h55m = 21300 秒
          echo "开始保温，将持续约 $((END/60)) 分钟"
          while [ $SECONDS -lt $END ]; do
            curl -s -o /dev/null -m 20 "https://upxuu.com/" || true
            sleep 30
          done
          echo "保温完成，共运行 $SECONDS 秒"
