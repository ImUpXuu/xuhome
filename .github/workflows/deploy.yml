name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  TARGET_DIR: /var/www/upxuu

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        run: npm install -g pnpm@9

      - run: pnpm install --no-frozen-lockfile

      - run: pnpm build
        env:
          INDEXNOW_SECRET: ${{ secrets.INDEXNOW_SECRET }}

      - name: Save commit SHA
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      # 加服务器：复制一段 include，改 host / name 即可
      # 所有机器共用 secrets.SERVER_SSH_KEY（私钥）+ secrets.SERVER_USER
      matrix:
        include:
          - host: 8.220.197.92
            name: server-3
            port: 22
            auth: key
          - host: 47.243.228.164
            name: server-hk
            port: 22
            auth: password
      fail-fast: false
    name: deploy → ${{ matrix.name }} (${{ matrix.host }})
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p ${{ matrix.port }} -H ${{ matrix.host }} >> ~/.ssh/known_hosts 2>/dev/null
          if [ "${{ matrix.auth }}" = "key" ]; then
            # 密钥认证
            printf '%s\n' "${{ secrets.SERVER_SSH_KEY }}" | tr -d '\r' > ~/.ssh/deploy_key
            chmod 600 ~/.ssh/deploy_key
            echo "AUTH_METHOD=key" >> $GITHUB_ENV
          else
            # 密码认证
            echo "AUTH_METHOD=password" >> $GITHUB_ENV
            echo "SSHPASS=${{ secrets.SERVER_PASSWORD }}" >> $GITHUB_ENV
            # 安装 sshpass（密码认证需要）
            sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
          fi

      - name: Ensure directory exists on ${{ matrix.host }}
        run: |
          if [ "$AUTH_METHOD" = "key" ]; then
            SSH_CMD="ssh -i ~/.ssh/deploy_key -p ${{ matrix.port }}"
          else
            SSH_CMD="sshpass -e ssh -o PreferredAuthentications=password -o PubkeyAuthentication=no"
          fi
          $SSH_CMD \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            "${{ secrets.SERVER_USER }}@${{ matrix.host }}" \
            "mkdir -p ${{ env.TARGET_DIR }}"

      - name: Sync to ${{ matrix.host }}
        run: |
          if [ "$AUTH_METHOD" = "key" ]; then
            RSYNC_SSH="ssh -i ~/.ssh/deploy_key -p ${{ matrix.port }}"
          else
            RSYNC_SSH="sshpass -e ssh -o PreferredAuthentications=password -o PubkeyAuthentication=no -p ${{ matrix.port }}"
          fi
          rsync -avz --delete \
            -e "$RSYNC_SSH -o StrictHostKeyChecking=yes -o ConnectTimeout=15" \
            dist/ \
            "${{ secrets.SERVER_USER }}@${{ matrix.host }}:${{ env.TARGET_DIR }}/"
