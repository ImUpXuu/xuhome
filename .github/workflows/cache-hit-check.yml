name: 构建预热（Vercel + Cloudflare）

on:
  push:
    branches: [main]
    # HIT.txt 提交不触发本工作流，避免死循环
    paths-ignore:
      - 'HIT.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cache-warming-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 第一次预热：强制解析到 Vercel IP，预热 Vercel 边缘缓存
  warm-vercel:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: 等待部署完成
        if: github.event_name == 'push'
        run: sleep 80

      - name: 预热 Vercel 缓存（解析到 76.76.21.21）
        env:
          RESOLVE_IP: '76.76.21.21'
          ONE_PASS: '1'
          TZ: Asia/Shanghai
        run: bash .github/scripts/cache-warming.sh

  # 第二次预热：默认解析（Cloudflare），预热 CF 边缘缓存
  warm-cloudflare:
    needs: warm-vercel
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # ---- 预热前先清空 Cloudflare 全站缓存，确保边缘缓存放的是最新版本 ----
      # 注意：upxuu.com 挂在 SaaS zone 476543.xyz（自定义主机名）下，
      # CLOUDFLARE_ZONE_ID 必须是 476543.xyz 的 zone id（不是账号 id！）
      - name: 清除 Cloudflare 全站缓存
        if: github.event_name == 'push'
        env:
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "${CLOUDFLARE_ZONE_ID:-}" ] || [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::请配置 GitHub secrets：CLOUDFLARE_ZONE_ID（476543.xyz 的 zone id）+ CLOUDFLARE_API_TOKEN（Cache Purge 权限）"
            exit 1
          fi
          code=$(curl -s -o purge.log -w "%{http_code}" -m 30 \
            -X POST "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}')
          if [ "$code" = "200" ]; then
            echo "✅ Cloudflare 全站缓存已清空（zone ${CLOUDFLARE_ZONE_ID}），开始预热"
          else
            echo "❌ Cloudflare 缓存清除失败 HTTP=$code：$(cat purge.log)"
            echo "::error::Cloudflare 缓存清除失败，请检查 CLOUDFLARE_ZONE_ID 是否为 476543.xyz 的 zone id"
            exit 1
          fi

      - name: 预热 Cloudflare 缓存（默认解析）
        env:
          ONE_PASS: '1'
          TZ: Asia/Shanghai
        run: bash .github/scripts/cache-warming.sh
