name: Cloudflare 缓存持续保温

on:
  push:
    branches: [main]
    # HIT.txt 提交不触发本工作流，避免死循环
    paths-ignore:
      - 'HIT.txt'
  schedule:
    # 每 6 小时唤起下一次；本次最长运行 5 小时 58 分，留出交接缓冲
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cloudflare-cache-warming
  cancel-in-progress: true

jobs:
  cache-warming:
    runs-on: ubuntu-latest
    timeout-minutes: 359
    steps:
      - uses: actions/checkout@v4

      # 构建约 30s，缓冲 80s 确保部署完成
      - name: 等待部署完成
        if: github.event_name == 'push'
        run: sleep 80

      # ---- 预热前先清空 Cloudflare 全站缓存，确保边缘缓存放的是最新版本 ----
      # 注意：upxuu.com 挂在 SaaS zone 476543.xyz（自定义主机名）下，
      # CLOUDFLARE_ZONE_ID 必须是 476543.xyz 的 zone id（不是账号 id！）
      - name: 清除 Cloudflare 全站缓存
        env:
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "${CLOUDFLARE_ZONE_ID:-}" ] || [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::请配置 GitHub secrets：CLOUDFLARE_ZONE_ID（476543.xyz 的 zone id）+ CLOUDFLARE_API_TOKEN（Cache Purge 权限）"
            exit 1
          fi
          code=$(curl -s -o purge.log -w "%{http_code}" -m 30 \
            -X POST "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}')
          if [ "$code" = "200" ]; then
            echo "✅ Cloudflare 全站缓存已清空（zone ${CLOUDFLARE_ZONE_ID}），开始预热"
          else
            echo "❌ Cloudflare 缓存清除失败 HTTP=$code：$(cat purge.log)"
            echo "::error::Cloudflare 缓存清除失败，请检查 CLOUDFLARE_ZONE_ID 是否为 476543.xyz 的 zone id"
            exit 1
          fi

      - name: 提取 sitemap 所有页面 URL
      - name: 持续预热全站页面（每 5 分钟一轮）
        env:
          RUN_SECONDS: '21480'
          INTERVAL_SECONDS: '300'
        run: |
          set -u -o pipefail
          deadline=$(( $(date +%s) + RUN_SECONDS ))
          cycle=0

          while [ "$(date +%s)" -lt "$deadline" ]; do
            cycle=$((cycle + 1))
            cycle_start="$(date +%s)"
            url_count=0

            if curl -fsS --retry 2 --retry-delay 2 -m 30 https://upxuu.com/sitemap.xml \
              | grep -oP '(?<=<loc>)[^<]+' \
              | sed 's/\r$//' > urls.txt; then
              printf '%s\n' \
                "https://upxuu.com/bot/" \
                "https://upxuu.com/bot/posts/" \
                "https://upxuu.com/bot/talks/" >> urls.txt

              # bot 优化页也是独立路由；sitemap 新增文章后下一轮会自动带上
              grep -oP 'https://upxuu\.com/posts/[^/\s?#]+' urls.txt \
                | sed 's|/posts/|/bot/|; s|$|/|' >> urls.txt
              grep -oP 'https://upxuu\.com/talk/[^/\s?#]+' urls.txt \
                | sed 's|/talk/|/bot/talk/|; s|$|/|' >> urls.txt
              sort -u urls.txt -o urls.txt
              url_count=$(wc -l < urls.txt)

              echo "[$(date -u '+%F %T')] 第 $cycle 轮：预热 $url_count 个页面"
              xargs -P 8 -I {} curl -sS -o /dev/null -m 20 "{}" < urls.txt || true
            else
              echo "::warning::[$(date -u '+%F %T')] 获取 sitemap 失败，本轮跳过"
            fi

            next_cycle=$(( cycle_start + INTERVAL_SECONDS ))
            now="$(date +%s)"
            if [ "$now" -lt "$next_cycle" ] && [ "$next_cycle" -lt "$deadline" ]; then
              sleep $(( next_cycle - now ))
            elif [ "$next_cycle" -lt "$deadline" ]; then
              sleep 5
            fi
          done

          echo "保温窗口结束：共执行 $cycle 轮"
