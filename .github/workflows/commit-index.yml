name: Commit Index

# 提交索引随仓库走：每次推送后重建 src/data/commit-index.json 并回写，
# 这样 Vercel 那边即使是浅克隆也能直接读到完整索引，不需要打 GitHub API。
on:
  push:
    branches: [main]
    paths-ignore:
      - 'src/data/commit-index.json'
  workflow_dispatch:

concurrency:
  group: commit-index
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    # 防循环：跳过本 workflow 自己的回写提交。
    # 按提交作者判断而不是搜提交信息里的标记——任何提到该标记的正常提交
    # （比如说明这套机制的 commit）都会被误跳过。
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.author.name != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          # 索引要读全量提交历史，必须完整克隆
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Rebuild commit index
        run: node scripts/build-commit-index.mjs --full

      - name: Commit index if changed
        run: |
          if git diff --quiet -- src/data/commit-index.json; then
            echo "index unchanged — nothing to push"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/commit-index.json
          git commit -m "chore(stats): 更新提交索引"
          git push
