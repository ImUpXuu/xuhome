name: Commit Index

# 提交索引随仓库走：每次推送后重建 src/data/commit-index.json 并回写，
# 这样 Vercel 那边即使是浅克隆也能直接读到完整索引，不需要打 GitHub API。
on:
  push:
    branches: [main]
    paths-ignore:
      - 'src/data/commit-index.json'
  workflow_dispatch:

concurrency:
  group: commit-index
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    # 防循环：本 workflow 自己的回写提交不再触发下一轮
    if: "!contains(github.event.head_commit.message, '[skip index]')"
    steps:
      - uses: actions/checkout@v4
        with:
          # 索引要读全量提交历史，必须完整克隆
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Rebuild commit index
        run: node scripts/build-commit-index.mjs --full

      - name: Commit index if changed
        run: |
          if git diff --quiet -- src/data/commit-index.json; then
            echo "index unchanged — nothing to push"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/commit-index.json
          git commit -m "chore(stats): 更新提交索引 [skip index]"
          git push
